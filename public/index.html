<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewlly AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg:          #0a0a0f;
            --surface:     #111118;
            --surface2:    #18181f;
            --border:      #2a2a38;
            --accent:      #7c6aff;
            --accent2:     #ff6a9b;
            --accent3:     #6affdc;
            --text:        #e8e8f0;
            --muted:       #6b6b80;
            --user-bg:     #1e1640;
            --user-border: #4a3aaa;
            --error-bg:    rgba(255,60,60,.08);
            --error-border:rgba(255,60,60,.3);
            --error-text:  #ff9090;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 50% at 10% 20%, rgba(124,106,255,.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(255,106,155,.08) 0%, transparent 60%),
                radial-gradient(ellipse 40% 60% at 50% 50%, rgba(106,255,220,.04) 0%, transparent 70%);
            pointer-events: none;
            animation: bgShift 12s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: .7; transform: scale(1.05); }
        }

        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(124,106,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,106,255,.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        header {
            position: relative; z-index: 10;
            padding: 0 1.5rem;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,15,.8);
            backdrop-filter: blur(20px);
        }

        .logo { display: flex; align-items: center; gap: .75rem; }
        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(124,106,255,.4);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 20px rgba(124,106,255,.4); }
            50%      { box-shadow: 0 0 35px rgba(124,106,255,.7), 0 0 60px rgba(124,106,255,.2); }
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-name {
            font-size: 1.1rem; font-weight: 800;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-sub {
            font-family: 'Space Mono', monospace;
            font-size: .6rem; color: var(--muted); letter-spacing: .1em;
            text-transform: uppercase; margin-top: 2px;
        }

        .status-pill {
            display: flex; align-items: center; gap: .5rem;
            font-family: 'Space Mono', monospace;
            font-size: .65rem; color: var(--accent3); letter-spacing: .08em;
            text-transform: uppercase;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent3);
            box-shadow: 0 0 8px var(--accent3);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        .btn-reset {
            font-family: 'Space Mono', monospace;
            font-size: .65rem; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); background: transparent;
            border: 1px solid var(--border); border-radius: 6px;
            padding: .4rem .8rem; cursor: pointer; transition: all .2s;
        }
        .btn-reset:hover   { color: var(--text); border-color: var(--accent); }
        .btn-reset:disabled{ opacity: .4; cursor: not-allowed; }

        .header-right { display: flex; align-items: center; gap: 1rem; }

        main {
            position: relative; z-index: 10;
            flex: 1; overflow-y: auto;
            padding: 2rem 1rem;
            display: flex; flex-direction: column; gap: 1.5rem;
            scroll-behavior: smooth;
        }
        main::-webkit-scrollbar { width: 4px; }
        main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .msg-row {
            display: flex;
            animation: slideIn .3s cubic-bezier(.34,1.56,.64,1) both;
        }
        @keyframes slideIn {
            from { opacity:0; transform:translateY(16px) scale(.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.bot  { justify-content: flex-start; align-items: flex-end; gap: .6rem; }

        .bot-avatar {
            width: 32px; height: 32px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            box-shadow: 0 0 12px rgba(124,106,255,.35);
        }

        .bubble {
            max-width: min(85%, 720px);
            padding: 1rem 1.2rem;
            border-radius: 18px;
            line-height: 1.65;
            font-size: .93rem;
            position: relative;
        }
        .bubble.user {
            background: var(--user-bg);
            border: 1px solid var(--user-border);
            border-bottom-right-radius: 4px;
            color: #d4ccff;
        }
        .bubble.bot {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }
        .bubble.bot::before {
            content: '';
            position: absolute; inset: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(124,106,255,.15), transparent 50%);
            pointer-events: none;
        }
        .bubble.error {
            background: var(--error-bg) !important;
            border-color: var(--error-border) !important;
            color: var(--error-text) !important;
            font-family: 'Space Mono', monospace;
            font-size: .82rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .bubble.error::before { display: none; }

        /* Markdown */
        .bubble.bot p  { margin-bottom: .5rem; }
        .bubble.bot p:last-child { margin-bottom: 0; }
        .bubble.bot ul, .bubble.bot ol { padding-left: 1.4rem; margin-bottom: .5rem; }
        .bubble.bot li { margin-bottom: .2rem; }
        .bubble.bot strong { color: #c4b5ff; }
        .bubble.bot em    { color: var(--accent3); font-style: italic; }
        .bubble.bot h1,.bubble.bot h2,.bubble.bot h3 {
            font-family: 'Syne', sans-serif; font-weight: 700;
            color: #c4b5ff; margin: .8rem 0 .4rem;
        }
        .bubble.bot h1 { font-size: 1.15rem; }
        .bubble.bot h2 { font-size: 1rem; }
        .bubble.bot h3 { font-size: .92rem; }
        .bubble.bot code:not(pre code) {
            font-family: 'Space Mono', monospace;
            background: rgba(124,106,255,.15);
            border: 1px solid rgba(124,106,255,.25);
            color: #b8a9ff;
            padding: .1em .4em; border-radius: 4px; font-size: .82em;
        }
        .bubble.bot pre {
            margin: .75rem 0; border-radius: 10px;
            border: 1px solid var(--border);
            overflow-x: auto; position: relative;
        }
        .bubble.bot pre::before {
            content: attr(data-lang);
            position: absolute; top: .5rem; right: .75rem;
            font-family: 'Space Mono', monospace;
            font-size: .6rem; color: var(--muted); text-transform: uppercase;
        }
        .bubble.bot pre code { font-size: .82rem; }

        /* Typing dots */
        .dot {
            display: inline-block;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--muted); margin: 0 2px;
            animation: bounce .9s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: .15s; }
        .dot:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce {
            0%,80%,100% { transform:translateY(0); }
            40%          { transform:translateY(-6px); background:var(--accent); }
        }

        /* Welcome card */
        .welcome { display: flex; justify-content: center; margin: 2rem 0; }
        .welcome-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 2.5rem;
            max-width: 560px; width: 100%;
            text-align: center; position: relative; overflow: hidden;
        }
        .welcome-card::before {
            content: '';
            position: absolute; inset: -1px; border-radius: inherit;
            background: linear-gradient(135deg, rgba(124,106,255,.2), rgba(255,106,155,.1), transparent 60%);
            pointer-events: none;
        }
        .welcome-emoji { font-size: 3rem; margin-bottom: 1rem; display: block; }
        .welcome-title { font-size: 1.1rem; font-weight: 700; color: #c4b5ff; margin-bottom: .75rem; }
        .welcome-card p { color: var(--muted); font-size: .9rem; line-height: 1.6; }
        .tags { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1.25rem; }
        .tag {
            font-family: 'Space Mono', monospace;
            font-size: .65rem; padding: .3rem .7rem;
            border-radius: 6px; letter-spacing: .05em; text-transform: uppercase;
            background: rgba(124,106,255,.1); border: 1px solid rgba(124,106,255,.3); color: var(--accent);
        }
        .tag.green  { background:rgba(106,255,220,.1); border-color:rgba(106,255,220,.3); color:var(--accent3); }
        .tag.pink   { background:rgba(255,106,155,.1); border-color:rgba(255,106,155,.3); color:var(--accent2); }
        .tag.yellow { background:rgba(255,220,50,.1);  border-color:rgba(255,220,50,.3);  color:#ffd832; }

        /* Footer */
        footer {
            position: relative; z-index: 10;
            padding: 1rem 1rem 1.25rem;
            border-top: 1px solid var(--border);
            background: rgba(10,10,15,.9);
            backdrop-filter: blur(20px);
        }
        .input-wrap {
            max-width: 760px; margin: 0 auto;
            display: flex; gap: .6rem; align-items: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px; padding: .5rem .5rem .5rem 1rem;
            transition: border-color .2s;
        }
        .input-wrap:focus-within { border-color: var(--accent); }
        .input-wrap input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text); font-family: 'Syne', sans-serif;
            font-size: .95rem; padding: .4rem 0;
        }
        .input-wrap input::placeholder { color: var(--muted); }
        .input-wrap button {
            width: 40px; height: 40px; flex-shrink: 0;
            background: var(--accent); border: none; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all .2s;
        }
        .input-wrap button:hover  { background:#9b8dff; transform:scale(1.05); }
        .input-wrap button:active { transform:scale(.96); }
        .input-wrap button:disabled { opacity:.4; cursor:not-allowed; transform:none; }
        .input-wrap button svg { width:18px; height:18px; fill:#fff; }
        .input-hint {
            text-align: center; margin-top: .6rem;
            font-family: 'Space Mono', monospace;
            font-size: .6rem; color: var(--muted); letter-spacing: .05em;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">🤖</div>
        <div class="logo-text">
            <span class="logo-name">Jewlly</span>
            <span class="logo-sub">Mentor Web AI</span>
        </div>
    </div>
    <div class="header-right">
        <div class="status-pill">
            <div class="status-dot"></div>
            Online
        </div>
        <button class="btn-reset" id="btnReset" onclick="reiniciarChat()">↺ Reiniciar</button>
    </div>
</header>

<main id="chat-container">
    <div class="welcome">
        <div class="welcome-card">
            <span class="welcome-emoji">🤖</span>
            <div class="welcome-title">Olá! Sou o Dollynho, seu mentor de desenvolvimento web.</div>
            <p>Pode me perguntar sobre qualquer coisa — vou te explicar com exemplos práticos e código formatado.</p>
            <div class="tags">
                <span class="tag">PHP</span>
                <span class="tag green">HTML</span>
                <span class="tag pink">CSS</span>
                <span class="tag yellow">JavaScript</span>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="input-wrap">
        <input
            type="text"
            id="userInput"
            placeholder="Qual é a sua dúvida hoje?"
            autocomplete="off"
        >
        <button id="sendBtn" title="Enviar">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
    <p class="input-hint">Enter para enviar &nbsp;·&nbsp; HuggingFace Inference API</p>
</footer>

<script>
"use strict";

// ── Marked.js config ──────────────────────────────────────────────────────────
(function () {
    const renderer = new marked.Renderer();
    renderer.code = function (token, langFallback) {
        const isObj = token !== null && typeof token === 'object';
        const code  = isObj ? String(token.text ?? token.raw ?? '') : String(token ?? '');
        const lang  = isObj ? String(token.lang ?? '') : String(langFallback ?? '');
        const hl    = lang && hljs.getLanguage(lang)
            ? hljs.highlight(code, { language: lang }).value
            : hljs.highlightAuto(code).value;
        return '<pre data-lang="' + lang + '"><code class="hljs">' + hl + '</code></pre>';
    };
    marked.use({ renderer, breaks: true });
}());

// ── Helpers ───────────────────────────────────────────────────────────────────
function escapeHtml(s) {
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function scrollBottom() {
    var c = document.getElementById('chat-container');
    c.scrollTop = c.scrollHeight;
}
function setUi(loading) {
    ['userInput','sendBtn','btnReset'].forEach(function(id){
        document.getElementById(id).disabled = loading;
    });
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function makeAvatar() {
    var el = document.createElement('div');
    el.className = 'bot-avatar';
    el.textContent = '🤖';
    return el;
}
function makeRow(role) {
    var el = document.createElement('div');
    el.className = 'msg-row ' + (role === 'user' ? 'user' : 'bot');
    return el;
}
function makeBubble(role, html, isError) {
    var el = document.createElement('div');
    var cls = 'bubble ' + (role === 'user' ? 'user' : 'bot');
    if (isError) cls += ' error';
    el.className = cls;
    el.innerHTML = html;
    return el;
}

// ── Mensagens ─────────────────────────────────────────────────────────────────
function addMsg(content, role, isError) {
    var container = document.getElementById('chat-container');
    var row       = makeRow(role);
    var safe      = content != null ? String(content) : '';

    if (role !== 'user') row.appendChild(makeAvatar());

    var html   = (role === 'user' || isError) ? escapeHtml(safe) : marked.parse(safe);
    var bubble = makeBubble(role, html, isError);

    row.appendChild(bubble);
    container.appendChild(row);
    scrollBottom();

    if (!isError) {
        bubble.querySelectorAll('pre code').forEach(function(el){ hljs.highlightElement(el); });
    }
}

function addTyping() {
    var container = document.getElementById('chat-container');
    var row = makeRow('bot');
    row.id  = 'typing';
    var bubble = makeBubble('bot','<div class="dot"></div><div class="dot"></div><div class="dot"></div>',false);
    row.appendChild(makeAvatar());
    row.appendChild(bubble);
    container.appendChild(row);
    scrollBottom();
}
function removeTyping() {
    var el = document.getElementById('typing');
    if (el) el.remove();
}

// ── Comunicação ───────────────────────────────────────────────────────────────

/**
 * Tenta parsear JSON da resposta do servidor de forma robusta.
 * Garante que warnings PHP que vazem antes do { não quebrem tudo.
 */
function parseResponse(raw) {
    // 1. Parse direto
    try { return JSON.parse(raw); } catch(_){}

    // 2. Pula garbage antes do primeiro {
    var i = raw.indexOf('{');
    if (i > 0) { try { return JSON.parse(raw.slice(i)); } catch(_){} }

    // 3. Extrai o maior bloco JSON
    var m = raw.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch(_){} }

    // 4. Mostra o raw completo para facilitar debug
    return {
        error: 'Resposta bruta do servidor (não é JSON válido):\n\n' +
               (raw.trim() || '(vazio — o PHP pode ter travado antes de responder)')
    };
}

async function postToChat(body) {
    var resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    var raw = await resp.text();
    return parseResponse(raw);
}

function handleResponse(data) {
    if (data && data.reply) {
        addMsg(data.reply, 'assistant', false);
        return;
    }
    var msg = (data && data.error) ? data.error : 'Resposta inesperada: ' + JSON.stringify(data);
    addMsg('⚠️ ' + msg, 'assistant', true);
}

// ── Enviar ────────────────────────────────────────────────────────────────────
async function sendMessage() {
    var input   = document.getElementById('userInput');
    var message = input.value.trim();
    if (!message) return;

    input.value = '';
    setUi(true);
    addMsg(message, 'user', false);
    addTyping();

    try {
        var data = await postToChat({ message: message });
        removeTyping();
        handleResponse(data);
    } catch (err) {
        removeTyping();
        addMsg('⚠️ Erro de conexão: ' + err.message + '\n\nVerifique se o servidor PHP está rodando.', 'assistant', true);
    } finally {
        setUi(false);
        document.getElementById('userInput').focus();
    }
}

// ── Reiniciar ─────────────────────────────────────────────────────────────────
// Limpa o histórico no servidor (chat_history.json) E recarrega a página.
async function reiniciarChat() {
    if (!confirm('Reiniciar o chat? O histórico será apagado.')) return;
    setUi(true);
    try { await postToChat({ clearHistory: true, message: '' }); } catch(_){}
    window.location.reload();
}

// ── Eventos ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('userInput').addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
});
</script>
</body>
</html>
